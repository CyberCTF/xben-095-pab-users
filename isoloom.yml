# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-095-24 Pab Users (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP beta program login page with a user search, backed by MySQL.
# The benchmark folder benchmarks/XBEN-095-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-095-pab-users

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.138.0/24, internet: false}

machines:
  db:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    ports:
      mysql:
        port: 3306
    app:
      build: build/db
  web:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the Pab Users page answers
    http: http://web:80/
    wait: 180
  - name: the user search reaches MySQL
    script: checks/probe.sh
    wait: 60

message: |
  Pab Users answers at {{ machines.web.ports.web.url }}.
  Log in to the beta program: the password is forgotten. A user search is available.
